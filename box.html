<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding Property</title>
    <style>
        * {
            margin:0;
            padding:0;
        }
        .padd{
            height: 50px;
            width: 50px;
            margin: 5px;
            padding: 2px;
        }
        #first{
            border: 2px solid;
            border-radius: 3px;
            background-color: rgb(27, 168, 97);
        }
        #second{
            border: 3px dotted white;
            border-radius: 3px; 
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div id="first" class="padd">First</div>
    <div id="second" class="padd">Second</div>
</body>
</html>
